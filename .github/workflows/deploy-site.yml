name: Deploy Site

on:
  # Triggered when us-code data changes are pushed
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Fetch full submodule history (needed for diff generation)
        run: |
          cd apps/web/content-data
          git fetch --tags --force --unshallow 2>/dev/null || git fetch --tags --force

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get submodule commit for cache key
        id: submodule-ref
        run: echo "sha=$(git -C apps/web/content-data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore diff cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/diffs/
          key: diffs-${{ steps.submodule-ref.outputs.sha }}
          restore-keys: |
            diffs-

      - name: Generate static diffs (incremental)
        run: npx tsx scripts/generate-diffs.ts --repo apps/web/content-data --output apps/web/public/diffs/

      - name: Build site
        run: pnpm --filter @civic-source/web build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Informational audit only — the report is uploaded to temporary public
      # storage (link in the action logs). No budget is enforced: an empty
      # `budgetPath` was a no-op, and a real budget would be a flaky,
      # baseline-less gate, so neither is configured (#234).
      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: |
            https://civic-source.github.io/us-code-tracker/
            https://civic-source.github.io/us-code-tracker/browse/title-18/
          temporaryPublicStorage: true
